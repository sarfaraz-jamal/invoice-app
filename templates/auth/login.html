<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GOAT Invoice</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >
</head>

<body>

    <main class="auth-page">

        <div class="auth-card login-card">

            <!-- Branding -->
            <div class="auth-logo">

                <div class="logo-mark">
                    G
                </div>

                <div>
                    <div class="logo-text">
                        GOAT Invoice
                    </div>

                    <div class="login-brand-sub">
                        FBR Digital Invoicing
                    </div>
                </div>

            </div>


            <!-- Heading -->
            <div class="login-heading">

                <h1 class="auth-title">
                    Welcome back
                </h1>

                <p class="auth-sub">
                    Sign in to manage your invoices and FBR submissions.
                </p>

            </div>


            <!-- Login error -->
            {% if error %}

                <div class="alert alert-danger login-error">

                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"></circle>
                        <line x1="12" y1="8" x2="12" y2="13"></line>
                        <circle cx="12" cy="16.5" r="0.5"></circle>
                    </svg>

                    <span>
                        {{ error }}
                    </span>

                </div>

            {% endif %}


            <!-- Login Form -->
            <form
                method="post"
                action="/login"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>


                <div class="form-group">

                    <div class="login-label-row">

                        <label for="password">
                            Password
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary login-submit"
                >
                    Sign In
                </button>

            </form>


            <!-- Footer -->
            <div class="login-footer">

                <div class="security-badge">

                    <svg viewBox="0 0 24 24">
                        <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    </svg>

                    Secure FBR-integrated invoicing

                </div>

            </div>

        </div>

    </main>

</body>

</html>
