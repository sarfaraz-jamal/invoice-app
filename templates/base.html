<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% block title %}InvoicePK{% endblock %}
  </title>

  <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

      <!-- Brand -->
      <div class="sidebar-brand">
        <div>
          <div class="brand-name">GOAT Invoice</div>
          <div class="brand-subtitle">FBR Invoicing</div>
        </div>
      </div>


      <!-- Tenant -->
      <div class="tenant-switcher">

        <div class="tenant-avatar">
          SJ
        </div>

        <div class="tenant-info">

          <div class="tenant-name">
            Sarfaraz Jamal
          </div>

          <div class="tenant-ntn">
            NTN 1043707-0
          </div>

        </div>

        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M7 15l5 5 5-5M7 9l5-5 5 5"/>
        </svg>

      </div>


      <!-- Navigation -->
      <div class="nav-section mt-2">

        <!-- Dashboard -->
        <a
          class="nav-item"
          data-path="/"
          href="/"
        >

          <svg viewBox="0 0 24 24">

            <path
              d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
            />

            <polyline
              points="9 22 9 12 15 12 15 22"
            />

          </svg>

          Dashboard

        </a>


        <!-- Invoices -->
        <a
          class="nav-item"
          data-path="/invoices"
          href="/invoices"
        >

          <svg viewBox="0 0 24 24">

            <path
              d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
            />

            <polyline
              points="14 2 14 8 20 8"
            />

            <line
              x1="16"
              y1="13"
              x2="8"
              y2="13"
            />

            <line
              x1="16"
              y1="17"
              x2="8"
              y2="17"
            />

            <polyline
              points="10 9 9 9 8 9"
            />

          </svg>

          Invoices

        </a>

      </div>


      <!-- Sidebar Footer -->
      <div class="sidebar-footer">

        <div class="user-row">

          <div class="user-avatar">
            SJ
          </div>

          <div>

            <div class="user-name">
              Sarfaraz Jamal
            </div>

            <div class="user-role">
              Admin
            </div>

          </div>

        </div>

      </div>

    </aside>


    <!-- Main Area -->
    <main class="main">

      <!-- Topbar -->
      <header class="topbar">

        <div>

          <h1 class="page-title">
            {% block page_title %}
            Dashboard
            {% endblock %}
          </h1>

        </div>


        <div class="topbar-actions">

          {% block topbar_actions %}
          {% endblock %}

        </div>

      </header>


      <!-- Page Content -->
      <div class="content">

        {% block content %}
        {% endblock %}

      </div>

    </main>

  </div>

</body>

</html>
